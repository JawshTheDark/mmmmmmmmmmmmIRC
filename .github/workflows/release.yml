name: Release

# Tag a commit to cut a release, e.g.:
#   git tag v0.1.0 && git push origin v0.1.0
# Each job builds its platform artifact and attaches it to the GitHub Release for
# the tag INDEPENDENTLY, so a hiccup on one platform never blocks the other.
on:
  push:
    tags: [ 'v*' ]
  workflow_dispatch:
    inputs:
      tag:
        description: 'Tag/name for the release (manual runs)'
        required: false
        default: 'dev'

permissions:
  contents: write

jobs:
  windows:
    name: Windows zip
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4

      - name: Set up MSVC (x64)
        uses: ilammy/msvc-dev-cmd@v1

      - name: Install Ninja
        run: choco install ninja -y

      - name: Install Qt
        uses: jurplel/install-qt-action@v4
        with:
          version: '6.8.1'
          modules: 'qtwebsockets qtimageformats'
          cache: true

      - name: Build (GUI only)
        run: |
          cmake -S . -B build -G Ninja -DCMAKE_BUILD_TYPE=Release -DLURKER_BUILD_GUI=ON
          cmake --build build --target mmmmmmmmmmmmirc

      - name: Deploy with windeployqt
        shell: pwsh
        run: |
          New-Item -ItemType Directory -Force -Path dist | Out-Null
          $exe = Get-ChildItem -Path build -Recurse -Filter mmmmmmmmmmmmirc.exe | Select-Object -First 1
          if (-not $exe) { throw "mmmmmmmmmmmmirc.exe not found under build/" }
          Write-Host "Found $($exe.FullName)"
          Copy-Item $exe.FullName dist\
          windeployqt --release --no-translations --no-system-d3d-compiler dist\mmmmmmmmmmmmirc.exe

      - name: Package zip
        shell: pwsh
        run: |
          $tag = "${{ github.ref_name }}"
          Compress-Archive -Path dist\* -DestinationPath "mmmmmmmmmmmmirc-$tag-windows-x64.zip"

      - uses: actions/upload-artifact@v4
        with:
          name: windows-zip
          path: mmmmmmmmmmmmirc-*-windows-x64.zip
          if-no-files-found: error

      - name: Attach to release
        if: startsWith(github.ref, 'refs/tags/')
        uses: softprops/action-gh-release@v2
        with:
          files: mmmmmmmmmmmmirc-*-windows-x64.zip
          generate_release_notes: true
          fail_on_unmatched_files: true

  linux:
    name: Linux AppImage
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Install build dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y ninja-build libgl1-mesa-dev libxkbcommon-dev libfuse2

      - name: Install Qt
        uses: jurplel/install-qt-action@v4
        with:
          version: '6.8.1'
          modules: 'qtwebsockets qtimageformats'
          cache: true

      - name: Build (GUI only)
        run: |
          cmake -S . -B build -G Ninja -DCMAKE_BUILD_TYPE=Release
          cmake --build build --target mmmmmmmmmmmmirc

      - name: Stage AppDir
        run: |
          mkdir -p AppDir/usr/bin AppDir/usr/share/applications AppDir/usr/share/icons/hicolor/256x256/apps
          cp build/src/gui/mmmmmmmmmmmmirc AppDir/usr/bin/
          cp packaging/mmmmmmmmmmmmirc.desktop AppDir/usr/share/applications/
          cp packaging/mmmmmmmmmmmmirc.png AppDir/usr/share/icons/hicolor/256x256/apps/mmmmmmmmmmmmirc.png

      - name: Fetch linuxdeploy
        run: |
          wget -q https://github.com/linuxdeploy/linuxdeploy/releases/download/continuous/linuxdeploy-x86_64.AppImage
          wget -q https://github.com/linuxdeploy/linuxdeploy-plugin-qt/releases/download/continuous/linuxdeploy-plugin-qt-x86_64.AppImage
          chmod +x linuxdeploy-x86_64.AppImage linuxdeploy-plugin-qt-x86_64.AppImage

      - name: Build AppImage
        env:
          APPIMAGE_EXTRACT_AND_RUN: 1
          # linuxdeploy's appimage plugin names the output from $OUTPUT.
          OUTPUT: mmmmmmmmmmmmirc-${{ github.ref_name }}-x86_64.AppImage
        run: |
          ./linuxdeploy-x86_64.AppImage --appdir AppDir --plugin qt --output appimage
          ls -la mmmmmmmmmmmmirc-*-x86_64.AppImage

      - uses: actions/upload-artifact@v4
        with:
          name: linux-appimage
          path: mmmmmmmmmmmmirc-*-x86_64.AppImage
          if-no-files-found: error

      - name: Attach to release
        if: startsWith(github.ref, 'refs/tags/')
        uses: softprops/action-gh-release@v2
        with:
          files: mmmmmmmmmmmmirc-*-x86_64.AppImage
          generate_release_notes: true
          fail_on_unmatched_files: true
